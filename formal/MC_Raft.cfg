\* TLC model-checking configuration for Raft.tla.
\* A small finite instance that is tractable to exhaustively check.
\* Run with -deadlock (the bounded model intentionally reaches terminal
\* states when MaxTerm/MaxLogLen are hit; that is not a protocol deadlock).
SPECIFICATION Spec

CONSTANTS
    Server = {s1, s2, s3}
    Value  = {v1, v2}
    MaxTerm = 3
    MaxLogLen = 3

INVARIANT TypeOK
INVARIANT CommitIndexBounded
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness
INVARIANT StateMachineSafety
